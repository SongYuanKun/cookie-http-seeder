<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cookie HTTP Seeder</title>
    <style>
      body {
        margin: 0;
        font: 13px/1.45 system-ui, sans-serif;
        color: #1c1917;
        background: #fafaf9;
        width: 320px;
      }
      main {
        padding: 12px 14px 14px;
        display: grid;
        gap: 10px;
      }
      h1 {
        margin: 0;
        font-size: 14px;
      }
      label {
        display: grid;
        gap: 4px;
        color: #78716c;
        font-size: 12px;
      }
      input {
        border: 1px solid #e7e5e4;
        border-radius: 6px;
        padding: 7px 8px;
        font: inherit;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 8px 12px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
        background: #0f766e;
        color: #fff;
      }
      button.secondary {
        background: #fff;
        color: #1c1917;
        border: 1px solid #e7e5e4;
      }
      #status {
        min-height: 2.8em;
        white-space: pre-wrap;
        color: #78716c;
        font-size: 12px;
      }
      #status.ok {
        color: #0f766e;
      }
      #status.error {
        color: #b91c1c;
      }
      .hint {
        color: #78716c;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Cookie HTTP Seeder</h1>
      <label>
        Receiver URL
        <input id="endpoint" type="url" placeholder="http://127.0.0.1:18765" />
      </label>
      <label>
        Bearer Token
        <input id="token" type="password" autocomplete="off" />
      </label>
      <label>
        Auto-push minutes (0=off, min 15)
        <input id="autoPushMinutes" type="number" min="0" step="1" />
      </label>
      <div class="row">
        <button id="save" class="secondary" type="button">Save</button>
        <button id="push" type="button">Push now</button>
      </div>
      <div id="status" class="hint">Log into target sites, then push.</div>
      <p class="hint">
        Forward if remote:
        <code>ssh -N -L 18765:127.0.0.1:18765 host</code>
      </p>
    </main>
    <script type="module" src="popup.js"></script>
  </body>
</html>
