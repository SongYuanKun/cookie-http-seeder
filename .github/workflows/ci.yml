name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check cookie_http_seeder tests scripts
      - name: Python tests
        run: pytest
      - name: Extension unit tests (no npm dependencies)
        run: npm test
      - name: Config sync check
        run: python scripts/sync_extension_sources.py --check
      - name: Build client and Python package
        if: matrix.python-version == '3.11'
        run: |
          python scripts/build_extension.py
          python -m pip wheel . --no-deps --wheel-dir dist
      - name: Upload versioned client
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: cookie-http-seeder-extension
          path: dist/cookie-http-seeder-extension-*.zip
          if-no-files-found: error
